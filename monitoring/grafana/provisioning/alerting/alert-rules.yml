apiVersion: 1

groups:
  - orgId: 1
    name: spring-boot-cpu-alerts
    folder: RPGym Monitoring

    # 1분마다 CPU 상태 평가
    interval: 1m

    rules:
      - uid: spring-boot-cpu-high
        title: Spring Boot CPU High
        condition: C

        data:
          # Spring Boot 프로세스 CPU 사용률 조회
          # uid가 prometheus인 데이터소스에서 process_cpu_usage를 조회
          - refId: A
            datasourceUid: prometheus
            relativeTimeRange:
              from: 300
              to: 0
            model:
              expr: process_cpu_usage
              instant: true
              intervalMs: 60000
              maxDataPoints: 43200
              refId: A

          # 각 서비스의 마지막 CPU 값 사용
          - refId: B
            datasourceUid: __expr__
            relativeTimeRange:
              from: 0
              to: 0
            model:
              expression: A
              reducer: last
              refId: B
              type: reduce

          # CPU 사용률 50% 초과 여부 판단
          - refId: C
            datasourceUid: __expr__
            relativeTimeRange:
              from: 0
              to: 0
            model:
              expression: B
              conditions:
                - evaluator:
                    params:
                      - 0.5
                    type: gt
              refId: C
              type: threshold

        noDataState: NoData
        execErrState: Error

        # 50% 초과 상태가 5분 지속되면 Firing
        for: 5m

        labels:
          severity: warning
          alertname: spring-boot-cpu-high

        annotations:
          summary: "Spring Boot 프로세스 CPU 사용률 50% 초과"
          description: "CPU 사용률이 5분 이상 50%를 초과했습니다."

  # Health Service Outbox 상태 모니터링
  - orgId: 1
    name: health-outbox-alerts
    folder: RPGym Monitoring

    # 1분마다 Outbox 상태 평가
    interval: 1m

    rules:
      # 최근 10분 동안 DLQ 이벤트가 1건 이상 발생하면 알림
      - uid: health-outbox-dlq-detected
        title: Health Outbox DLQ Detected
        condition: C

        data:
          # job 기준으로 집계하여 Blue/Green 환경을 구분
          - refId: A
            datasourceUid: prometheus
            relativeTimeRange:
              from: 600
              to: 0
            model:
              expr: sum by (job) (increase(rpgym_outbox_dlq_total[10m]))
              instant: true
              intervalMs: 60000
              maxDataPoints: 43200
              refId: A

          - refId: B
            datasourceUid: __expr__
            relativeTimeRange:
              from: 0
              to: 0
            model:
              expression: A
              reducer: last
              refId: B
              type: reduce

          # DLQ 발생 건수가 0보다 크면 Firing
          - refId: C
            datasourceUid: __expr__
            relativeTimeRange:
              from: 0
              to: 0
            model:
              expression: B
              conditions:
                - evaluator:
                    params:
                      - 0
                    type: gt
              refId: C
              type: threshold

        noDataState: OK
        execErrState: Error
        for: 0s

        labels:
          severity: warning
          alertname: health-outbox-dlq-detected

        annotations:
          summary: "Health Service Outbox DLQ 발생"
          description: "최근 10분 동안 Outbox 이벤트가 DLQ로 이동했습니다."


      # 미발행 Outbox 이벤트가 1000건을 초과한 상태가 5분 지속되면 알림
      - uid: health-outbox-pending-high
        title: Health Outbox Pending High
        condition: C

        data:
          # 미발행(PENDING) Outbox 이벤트 수 조회
          - refId: A
            datasourceUid: prometheus
            relativeTimeRange:
              from: 300
              to: 0
            model:
              expr: rpgym_outbox_pending_count
              instant: true
              intervalMs: 60000
              maxDataPoints: 43200
              refId: A

          - refId: B
            datasourceUid: __expr__
            relativeTimeRange:
              from: 0
              to: 0
            model:
              expression: A
              reducer: last
              refId: B
              type: reduce

          # 미발행 이벤트가 1000건을 초과했는지 판단
          - refId: C
            datasourceUid: __expr__
            relativeTimeRange:
              from: 0
              to: 0
            model:
              expression: B
              conditions:
                - evaluator:
                    params:
                      - 1000
                    type: gt
              refId: C
              type: threshold

        noDataState: NoData
        execErrState: Error

        # 1000건 초과 상태가 5분 지속되면 Firing
        for: 5m

        labels:
          severity: warning
          alertname: health-outbox-pending-high

        annotations:
          summary: "Health Service Outbox 발행 적체"
          description: "미발행 Outbox 이벤트가 1000건을 초과한 상태가 5분 이상 지속되었습니다."

  # Game Service 컨슈머 · Outbox 상태 모니터링 (리펙토링)
  # 모든 식에 job=~"game-.*" 를 건다. 지표 이름이 Health 와 겹쳐도 섞이지 않게 하기 위해서다
  # 배포 후 /actuator/prometheus 에서 지표 이름과 값이 실제로 나오는지 확인이 필요하다
  - orgId: 1
    name: game-consumer-alerts
    folder: RPGym Monitoring
    interval: 1m

    rules:
      # 받는 쪽: 소비에 실패해 DLT로 빼 둔 레코드가 생기면 바로 알림
      - uid: game-consumer-dlt-detected
        title: Game Consumer DLT Detected
        condition: C

        data:
          - refId: A
            datasourceUid: prometheus
            relativeTimeRange:
              from: 600
              to: 0
            model:
              expr: sum by (job) (increase(rpgym_kafka_consumer_dlt_total{job=~"game-.*"}[10m]))
              instant: true
              intervalMs: 60000
              maxDataPoints: 43200
              refId: A

          - refId: B
            datasourceUid: __expr__
            relativeTimeRange:
              from: 0
              to: 0
            model:
              expression: A
              reducer: last
              refId: B
              type: reduce

          - refId: C
            datasourceUid: __expr__
            relativeTimeRange:
              from: 0
              to: 0
            model:
              expression: B
              conditions:
                - evaluator:
                    params:
                      - 0
                    type: gt
              refId: C
              type: threshold

        # Blue/Green 중 쉬는 쪽은 항상 데이터가 없다. 데이터 없음을 장애로 보지 않는다
        noDataState: OK
        execErrState: Error
        for: 0s

        labels:
          severity: warning
          alertname: game-consumer-dlt-detected

        annotations:
          summary: "Game Service 컨슈머가 레코드를 DLT로 옮김"
          description: "최근 10분 동안 처리하지 못한 레코드가 <원본 토픽>.DLT 로 옮겨졌습니다. 헤더의 예외 정보로 원인을 확인하세요."

      # 받는 쪽: lag이 10분 내내 한 번도 0으로 내려오지 않으면 알림. 정각 스파이크처럼 쌓였다 빠지는 것은 걸리지 않는다
      - uid: game-consumer-lag-stuck
        title: Game Consumer Lag Stuck
        condition: C

        data:
          - refId: A
            datasourceUid: prometheus
            relativeTimeRange:
              from: 900
              to: 0
            model:
              expr: min_over_time(max by (job) (kafka_consumer_fetch_manager_records_lag_max{job=~"game-.*"})[10m:1m])
              instant: true
              intervalMs: 60000
              maxDataPoints: 43200
              refId: A

          - refId: B
            datasourceUid: __expr__
            relativeTimeRange:
              from: 0
              to: 0
            model:
              expression: A
              reducer: last
              refId: B
              type: reduce

          - refId: C
            datasourceUid: __expr__
            relativeTimeRange:
              from: 0
              to: 0
            model:
              expression: B
              conditions:
                - evaluator:
                    params:
                      - 0
                    type: gt
              refId: C
              type: threshold

        # Blue/Green 중 쉬는 쪽은 항상 데이터가 없다. 데이터 없음을 장애로 보지 않는다
        noDataState: OK
        execErrState: Error
        for: 0s

        labels:
          severity: warning
          alertname: game-consumer-lag-stuck

        annotations:
          summary: "Game Service 컨슈머 lag이 10분 동안 0으로 돌아오지 않음"
          description: "컨슈머가 멈췄거나(같은 레코드 무한 재시도 = DB 장애 등) 처리량이 유입을 못 따라갑니다."

      # 보내는 쪽: 가장 오래 기다린 미발행 이벤트의 시간. 브로커 장애 · 발행 스케줄러 정지 · 계속 실패하는 이벤트를 모두 잡는다
      - uid: game-outbox-oldest-pending-high
        title: Game Outbox Oldest Pending High
        condition: C

        data:
          - refId: A
            datasourceUid: prometheus
            relativeTimeRange:
              from: 300
              to: 0
            model:
              expr: max by (job) (rpgym_game_outbox_oldest_pending_age_seconds{job=~"game-.*"})
              instant: true
              intervalMs: 60000
              maxDataPoints: 43200
              refId: A

          - refId: B
            datasourceUid: __expr__
            relativeTimeRange:
              from: 0
              to: 0
            model:
              expression: A
              reducer: last
              refId: B
              type: reduce

          - refId: C
            datasourceUid: __expr__
            relativeTimeRange:
              from: 0
              to: 0
            model:
              expression: B
              conditions:
                - evaluator:
                    params:
                      - 60
                    type: gt
              refId: C
              type: threshold

        # Blue/Green 중 쉬는 쪽은 항상 데이터가 없다. 데이터 없음을 장애로 보지 않는다
        noDataState: OK
        execErrState: Error
        for: 2m

        labels:
          severity: warning
          alertname: game-outbox-oldest-pending-high

        annotations:
          summary: "Game Service Outbox 발행 정체"
          description: "가장 오래된 미발행 Outbox 이벤트가 60초 넘게 기다린 상태가 2분 이상 지속되었습니다."
