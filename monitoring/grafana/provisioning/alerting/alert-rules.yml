apiVersion: 1

groups:
  - orgId: 1
    name: spring-boot-cpu-alerts
    folder: RPGym Monitoring

    # 1분마다 CPU 상태 평가
    interval: 1m

    rules:
      - uid: spring-boot-cpu-high
        title: Spring Boot CPU High
        condition: C

        data:
          # Spring Boot 프로세스 CPU 사용률 조회
          # uid가 prometheus인 데이터소스에서 process_cpu_usage를 조회
          - refId: A
            datasourceUid: prometheus
            relativeTimeRange:
              from: 300
              to: 0
            model:
              expr: process_cpu_usage
              instant: true
              intervalMs: 60000
              maxDataPoints: 43200
              refId: A

          # 각 서비스의 마지막 CPU 값 사용
          - refId: B
            datasourceUid: __expr__
            relativeTimeRange:
              from: 0
              to: 0
            model:
              expression: A
              reducer: last
              refId: B
              type: reduce

          # CPU 사용률 50% 초과 여부 판단
          - refId: C
            datasourceUid: __expr__
            relativeTimeRange:
              from: 0
              to: 0
            model:
              expression: B
              conditions:
                - evaluator:
                    params:
                      - 0.5
                    type: gt
              refId: C
              type: threshold

        noDataState: NoData
        execErrState: Error

        # 50% 초과 상태가 5분 지속되면 Firing
        for: 5m

        labels:
          severity: warning
          alertname: spring-boot-cpu-high

        annotations:
          summary: "Spring Boot 프로세스 CPU 사용률 50% 초과"
          description: "CPU 사용률이 5분 이상 50%를 초과했습니다."

  # Health Service Outbox 상태 모니터링
  - orgId: 1
    name: health-outbox-alerts
    folder: RPGym Monitoring

    # 1분마다 Outbox 상태 평가
    interval: 1m

    rules:
      # 최근 10분 동안 DLQ 이벤트가 1건 이상 발생하면 알림
      - uid: health-outbox-dlq-detected
        title: Health Outbox DLQ Detected
        condition: C

        data:
          # job 기준으로 집계하여 Blue/Green 환경을 구분
          - refId: A
            datasourceUid: prometheus
            relativeTimeRange:
              from: 600
              to: 0
            model:
              expr: sum by (job) (increase(rpgym_outbox_dlq_total[10m]))
              instant: true
              intervalMs: 60000
              maxDataPoints: 43200
              refId: A

          - refId: B
            datasourceUid: __expr__
            relativeTimeRange:
              from: 0
              to: 0
            model:
              expression: A
              reducer: last
              refId: B
              type: reduce

          # DLQ 발생 건수가 0보다 크면 Firing
          - refId: C
            datasourceUid: __expr__
            relativeTimeRange:
              from: 0
              to: 0
            model:
              expression: B
              conditions:
                - evaluator:
                    params:
                      - 0
                    type: gt
              refId: C
              type: threshold

        noDataState: OK
        execErrState: Error
        for: 0s

        labels:
          severity: warning
          alertname: health-outbox-dlq-detected

        annotations:
          summary: "Health Service Outbox DLQ 발생"
          description: "최근 10분 동안 Outbox 이벤트가 DLQ로 이동했습니다."


      # 미발행 Outbox 이벤트가 1000건을 초과한 상태가 5분 지속되면 알림
      - uid: health-outbox-pending-high
        title: Health Outbox Pending High
        condition: C

        data:
          # 미발행(PENDING) Outbox 이벤트 수 조회
          - refId: A
            datasourceUid: prometheus
            relativeTimeRange:
              from: 300
              to: 0
            model:
              expr: rpgym_outbox_pending_count
              instant: true
              intervalMs: 60000
              maxDataPoints: 43200
              refId: A

          - refId: B
            datasourceUid: __expr__
            relativeTimeRange:
              from: 0
              to: 0
            model:
              expression: A
              reducer: last
              refId: B
              type: reduce

          # 미발행 이벤트가 1000건을 초과했는지 판단
          - refId: C
            datasourceUid: __expr__
            relativeTimeRange:
              from: 0
              to: 0
            model:
              expression: B
              conditions:
                - evaluator:
                    params:
                      - 1000
                    type: gt
              refId: C
              type: threshold

        noDataState: NoData
        execErrState: Error

        # 1000건 초과 상태가 5분 지속되면 Firing
        for: 5m

        labels:
          severity: warning
          alertname: health-outbox-pending-high

        annotations:
          summary: "Health Service Outbox 발행 적체"
          description: "미발행 Outbox 이벤트가 1000건을 초과한 상태가 5분 이상 지속되었습니다."

  # Game Service 컨슈머 · Outbox 상태 모니터링 (리펙토링)
  # 모든 식에 job=~"game-.*" 를 건다. 지표 이름이 Health 와 겹쳐도 섞이지 않게 하기 위해서다
  # 배포 후 /actuator/prometheus 에서 지표 이름과 값이 실제로 나오는지 확인이 필요하다
  - orgId: 1
    name: game-consumer-alerts
    folder: RPGym Monitoring
    interval: 1m

    rules:
      # 받는 쪽: 소비에 실패해 DLT로 빼 둔 레코드가 생기면 바로 알림
      - uid: game-consumer-dlt-detected
        title: Game Consumer DLT Detected
        condition: C

        data:
          - refId: A
            datasourceUid: prometheus
            relativeTimeRange:
              from: 600
              to: 0
            model:
              expr: sum by (job) (increase(rpgym_kafka_consumer_dlt_total{job=~"game-.*"}[10m]))
              instant: true
              intervalMs: 60000
              maxDataPoints: 43200
              refId: A

          - refId: B
            datasourceUid: __expr__
            relativeTimeRange:
              from: 0
              to: 0
            model:
              expression: A
              reducer: last
              refId: B
              type: reduce

          - refId: C
            datasourceUid: __expr__
            relativeTimeRange:
              from: 0
              to: 0
            model:
              expression: B
              conditions:
                - evaluator:
                    params:
                      - 0
                    type: gt
              refId: C
              type: threshold

        # Blue/Green 중 쉬는 쪽은 항상 데이터가 없다. 데이터 없음을 장애로 보지 않는다
        noDataState: OK
        execErrState: Error
        for: 0s

        labels:
          severity: warning
          alertname: game-consumer-dlt-detected

        annotations:
          summary: "Game Service 컨슈머가 레코드를 DLT로 옮김"
          description: "최근 10분 동안 처리하지 못한 레코드가 <원본 토픽>.DLT 로 옮겨졌습니다. Loki 에서 {job=~\"game-.*\"} |= \"DLT 적재\" 로 찾으면 위치 · eventId · 원인이 나옵니다(R-24)."

      # 받는 쪽: lag이 10분 내내 한 번도 0으로 내려오지 않으면 알림. 정각 스파이크처럼 쌓였다 빠지는 것은 걸리지 않는다
      - uid: game-consumer-lag-stuck
        title: Game Consumer Lag Stuck
        condition: C

        data:
          - refId: A
            datasourceUid: prometheus
            relativeTimeRange:
              from: 900
              to: 0
            model:
              # (R-23, 2026-10-12) records_lag_max(가져온 위치 기준)는 실패 레코드로 되감을 때마다 뒤 레코드까지 다시 가져와 0 이 된다.
              # 밀린 양이 한 번에 가져오는 양보다 적으면 멈춘 파티션을 못 잡아서(B-12: 20분 정지에도 0), 커밋 기준 lag 으로 바꿨다(ConsumerGroupLagMetrics).
              expr: min_over_time(max by (job) (rpgym_game_consumer_group_lag{job=~"game-.*"})[10m:1m])
              instant: true
              intervalMs: 60000
              maxDataPoints: 43200
              refId: A

          - refId: B
            datasourceUid: __expr__
            relativeTimeRange:
              from: 0
              to: 0
            model:
              expression: A
              reducer: last
              refId: B
              type: reduce

          - refId: C
            datasourceUid: __expr__
            relativeTimeRange:
              from: 0
              to: 0
            model:
              expression: B
              conditions:
                - evaluator:
                    params:
                      - 0
                    type: gt
              refId: C
              type: threshold

        # Blue/Green 중 쉬는 쪽은 항상 데이터가 없다. 데이터 없음을 장애로 보지 않는다
        noDataState: OK
        execErrState: Error
        for: 0s

        labels:
          severity: warning
          alertname: game-consumer-lag-stuck

        annotations:
          summary: "Game Service 컨슈머 lag이 10분 동안 0으로 돌아오지 않음"
          description: "컨슈머가 멈췄거나(같은 레코드 무한 재시도 = DB 장애 등) 처리량이 유입을 못 따라갑니다."

      # 보내는 쪽: 가장 오래 기다린 미발행 이벤트의 시간. 브로커 장애 · 발행 스케줄러 정지 · 계속 실패하는 이벤트를 모두 잡는다
      - uid: game-outbox-oldest-pending-high
        title: Game Outbox Oldest Pending High
        condition: C

        data:
          - refId: A
            datasourceUid: prometheus
            relativeTimeRange:
              from: 300
              to: 0
            model:
              expr: max by (job) (rpgym_game_outbox_oldest_pending_age_seconds{job=~"game-.*"})
              instant: true
              intervalMs: 60000
              maxDataPoints: 43200
              refId: A

          - refId: B
            datasourceUid: __expr__
            relativeTimeRange:
              from: 0
              to: 0
            model:
              expression: A
              reducer: last
              refId: B
              type: reduce

          - refId: C
            datasourceUid: __expr__
            relativeTimeRange:
              from: 0
              to: 0
            model:
              expression: B
              conditions:
                - evaluator:
                    params:
                      - 60
                    type: gt
              refId: C
              type: threshold

        # Blue/Green 중 쉬는 쪽은 항상 데이터가 없다. 데이터 없음을 장애로 보지 않는다
        noDataState: OK
        execErrState: Error
        for: 2m

        labels:
          severity: warning
          alertname: game-outbox-oldest-pending-high

        annotations:
          summary: "Game Service Outbox 발행 정체"
          description: "가장 오래된 미발행 Outbox 이벤트가 60초 넘게 기다린 상태가 2분 이상 지속되었습니다."

      # (R-15) 정합성 대조: 원장=지갑, 완료 퀘스트=원장, 파티 카운터=기여 합, 파티 보상=멤버 수, 랭킹=지갑 중 하나라도 어긋나면 알림
      - uid: game-reconcile-mismatch
        title: Game Reconcile Mismatch
        condition: C

        data:
          - refId: A
            datasourceUid: prometheus
            relativeTimeRange:
              from: 600
              to: 0
            model:
              expr: max by (job, check) (rpgym_reconcile_mismatch{job=~"game-.*"})
              instant: true
              intervalMs: 60000
              maxDataPoints: 43200
              refId: A

          - refId: B
            datasourceUid: __expr__
            relativeTimeRange:
              from: 0
              to: 0
            model:
              expression: A
              reducer: last
              refId: B
              type: reduce

          - refId: C
            datasourceUid: __expr__
            relativeTimeRange:
              from: 0
              to: 0
            model:
              expression: B
              conditions:
                - evaluator:
                    params:
                      - 0
                    type: gt
              refId: C
              type: threshold

        # Blue/Green 중 쉬는 쪽은 항상 데이터가 없다. 데이터 없음을 장애로 보지 않는다
        noDataState: OK
        execErrState: Error
        for: 0s

        labels:
          severity: critical
          alertname: game-reconcile-mismatch

        annotations:
          summary: "Game 정합성 대조에서 불일치 발견"
          description: "어긋난 검사는 check 라벨, 어긋난 식별자는 Loki 에서 \"정합성 불일치\" 로그로 확인하세요. 자동으로 고치지 않습니다. ranking 만 어긋났다면 랭킹 재구축(POST /api/v1/internal/games/rankings/rebuild)으로 복구합니다."

      # (R-15) 대조 작업이 30분 넘게 끝나지 않으면 알림. 대조가 멈추면 불일치 게이지가 0 인 채로 굳어 "정상"처럼 보이기 때문
      - uid: game-reconcile-stale
        title: Game Reconcile Not Running
        condition: C

        data:
          - refId: A
            datasourceUid: prometheus
            relativeTimeRange:
              from: 600
              to: 0
            model:
              expr: min by (job) (time() - rpgym_reconcile_last_success_timestamp{job=~"game-.*"} and rpgym_reconcile_last_success_timestamp{job=~"game-.*"} > 0)
              instant: true
              intervalMs: 60000
              maxDataPoints: 43200
              refId: A

          - refId: B
            datasourceUid: __expr__
            relativeTimeRange:
              from: 0
              to: 0
            model:
              expression: A
              reducer: last
              refId: B
              type: reduce

          - refId: C
            datasourceUid: __expr__
            relativeTimeRange:
              from: 0
              to: 0
            model:
              expression: B
              conditions:
                - evaluator:
                    params:
                      - 1800
                    type: gt
              refId: C
              type: threshold

        # Blue/Green 중 쉬는 쪽은 항상 데이터가 없다. 데이터 없음을 장애로 보지 않는다
        noDataState: OK
        execErrState: Error
        for: 0s

        labels:
          severity: warning
          alertname: game-reconcile-stale

        annotations:
          summary: "Game 정합성 대조가 30분 넘게 성공하지 못함"
          description: "ReconciliationJob 로그(정합성 대조 실패)를 확인하세요. DB 장애이거나 쿼리가 너무 오래 걸립니다."

      # (R-20) 랭킹 읽기 모델(ZSET · 레벨) 반영 실패. 그 사용자가 다음 XP 를 받을 때까지 랭킹이 틀린 채로 남는다
      - uid: game-ranking-update-failed
        title: Game Ranking Update Failed
        condition: C

        data:
          - refId: A
            datasourceUid: prometheus
            relativeTimeRange:
              from: 600
              to: 0
            model:
              expr: sum by (job) (increase(rpgym_ranking_update_failed_total{job=~"game-.*"}[10m]))
              instant: true
              intervalMs: 60000
              maxDataPoints: 43200
              refId: A

          - refId: B
            datasourceUid: __expr__
            relativeTimeRange:
              from: 0
              to: 0
            model:
              expression: A
              reducer: last
              refId: B
              type: reduce

          - refId: C
            datasourceUid: __expr__
            relativeTimeRange:
              from: 0
              to: 0
            model:
              expression: B
              conditions:
                - evaluator:
                    params:
                      - 0
                    type: gt
              refId: C
              type: threshold

        # Blue/Green 중 쉬는 쪽은 항상 데이터가 없다. 데이터 없음을 장애로 보지 않는다
        noDataState: OK
        execErrState: Error
        for: 0s

        labels:
          severity: warning
          alertname: game-ranking-update-failed

        annotations:
          summary: "Game 랭킹 반영 실패"
          description: "Redis 상태를 확인하고, 복구 뒤 랭킹 재구축(POST /api/v1/internal/games/rankings/rebuild)을 한 번 실행하세요."

      # (R-16) Health 발행부터 Game 처리 완료까지 p95 가 60초를 넘은 상태가 10분 이어지면 알림. 정각 스파이크(수십 초)가 금방 빠지는 것은 걸리지 않는다
      - uid: game-pipeline-latency-high
        title: Game Pipeline Latency High
        condition: C

        data:
          - refId: A
            datasourceUid: prometheus
            relativeTimeRange:
              from: 600
              to: 0
            model:
              expr: histogram_quantile(0.95, sum by (job, le) (rate(rpgym_game_consumer_pipeline_latency_seconds_bucket{job=~"game-.*"}[5m])))
              instant: true
              intervalMs: 60000
              maxDataPoints: 43200
              refId: A

          - refId: B
            datasourceUid: __expr__
            relativeTimeRange:
              from: 0
              to: 0
            model:
              expression: A
              reducer: last
              refId: B
              type: reduce

          - refId: C
            datasourceUid: __expr__
            relativeTimeRange:
              from: 0
              to: 0
            model:
              expression: B
              conditions:
                - evaluator:
                    params:
                      - 60
                    type: gt
              refId: C
              type: threshold

        # Blue/Green 중 쉬는 쪽은 항상 데이터가 없다. 데이터 없음을 장애로 보지 않는다
        noDataState: OK
        execErrState: Error
        for: 10m

        labels:
          severity: warning
          alertname: game-pipeline-latency-high

        annotations:
          summary: "Game 이벤트 처리 지연 p95 60초 초과(10분 지속)"
          description: "사용자가 운동 후 퀘스트 진행률을 1분 넘게 기다리고 있습니다. lag · DB 커밋 시간 · 재시도 로그를 확인하세요."

      # Notification 은 모든 예외를 무한 재시도한다(예외 분류 · DLT 없음, Game 범위 밖이라 고치지 않음). 버그 하나가 파티션을 멈춰도 다른 신호가 없어서 lag 으로만 감지한다
      - uid: notification-consumer-lag-stuck
        title: Notification Consumer Lag Stuck
        condition: C

        data:
          - refId: A
            datasourceUid: prometheus
            relativeTimeRange:
              from: 900
              to: 0
            model:
              expr: min_over_time(max by (job) (kafka_consumer_fetch_manager_records_lag_max{job=~"notification-.*"})[10m:1m])
              instant: true
              intervalMs: 60000
              maxDataPoints: 43200
              refId: A

          - refId: B
            datasourceUid: __expr__
            relativeTimeRange:
              from: 0
              to: 0
            model:
              expression: A
              reducer: last
              refId: B
              type: reduce

          - refId: C
            datasourceUid: __expr__
            relativeTimeRange:
              from: 0
              to: 0
            model:
              expression: B
              conditions:
                - evaluator:
                    params:
                      - 0
                    type: gt
              refId: C
              type: threshold

        # Blue/Green 중 쉬는 쪽은 항상 데이터가 없다. 데이터 없음을 장애로 보지 않는다
        noDataState: OK
        execErrState: Error
        for: 0s

        labels:
          severity: warning
          alertname: notification-consumer-lag-stuck

        annotations:
          summary: "Notification 컨슈머 lag 이 10분 동안 0 으로 돌아오지 않음"
          description: "Slack · user-service 장애로 재시도 중이거나, 특정 메시지에서 계속 실패해 파티션이 멈췄습니다. Notification 로그에서 같은 eventId 반복을 확인하세요."
